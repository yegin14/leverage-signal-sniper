services:
  - type: web
    name: leverage-signal-sniper
    runtime: docker
    region: frankfurt
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "8080"
      # Secrets are entered in the Render dashboard and never committed.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Binance blocks this shared server IP from time to time with HTTP 418.
      - key: CEX_VENUE
        value: bybit
      - key: DESK_MODEL
        value: claude-opus-5-5
      - key: DESK_DAILY_BUDGET_USD
        value: "1.0"
